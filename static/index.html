<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Internship Radar</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
      form { display: grid; gap: 0.75rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      label { display: grid; gap: 0.35rem; }
      input, button { font: inherit; padding: 0.65rem; }
      button { grid-column: 1 / -1; cursor: pointer; }
      #results { display: grid; gap: 1rem; margin-top: 1.5rem; }
      .card { border: 1px solid #7774; border-radius: 0.5rem; padding: 1rem; }
      .score { font-weight: 700; }
      .meta { color: #777; }
      .blockers { color: #b33; }
      #toast {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        max-width: 320px;
        padding: 0.75rem 1rem;
        border: 1px solid #7774;
        border-radius: 0.5rem;
        background: #111;
        color: #fff;
        box-shadow: 0 0.25rem 1rem #0004;
        z-index: 10;
      }
      footer { margin-top: 2rem; color: #777; }
      @media (max-width: 640px) { form { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Internship Radar</h1>
      <form id="profile-form">
        <label>Role<input name="role" required placeholder="Software Engineering Intern"></label>
        <label>Location<input name="location" required placeholder="Finland"></label>
        <label>Skills<input name="skills" placeholder="Python, FastAPI"></label>
        <label>Languages<input name="languages" placeholder="English"></label>
        <label>Work authorization<input name="work_authorization" required placeholder="Eligible to work in Finland"></label>
        <label>Extra notes<input name="extra_notes" placeholder="Graduation year, preferences"></label>
        <label><input type="checkbox" name="only_new"> Only new postings</label>
        <label><input type="checkbox" name="refresh"> Refresh Exa search</label>
        <button type="submit">Find internships</button>
      </form>
      <p id="status" role="status"></p>
      <section id="results"></section>
    </main>
    <footer id="footer">Provider: checking...</footer>
    <aside id="toast" role="status" aria-live="polite" hidden></aside>

    <script>
      const form = document.getElementById("profile-form");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const footer = document.getElementById("footer");
      const toast = document.getElementById("toast");

      function showToast(stage, detail) {
        toast.hidden = false;
        toast.replaceChildren();
        const stageElement = document.createElement("strong");
        stageElement.textContent = stage;
        const detailElement = document.createElement("div");
        detailElement.textContent = detail;
        toast.append(stageElement, detailElement);
      }

      function hideToast(delay = 0) {
        window.setTimeout(() => {
          toast.hidden = true;
        }, delay);
      }

      function splitList(value) {
        return value.split(",").map(item => item.trim()).filter(Boolean);
      }

      function readProfile() {
        const data = new FormData(form);
        return {
          role: data.get("role"),
          location: data.get("location"),
          skills: splitList(data.get("skills") || ""),
          languages: splitList(data.get("languages") || ""),
          work_authorization: data.get("work_authorization"),
          extra_notes: data.get("extra_notes") || ""
        };
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const profile = readProfile();
        const submitButton = form.querySelector('button[type="submit"]');

        status.textContent = "Searching...";
        results.replaceChildren();
        submitButton.disabled = true;
        showToast("Preparing", `Searching for ${profile.role} in ${profile.location}`);
        const progressTimer = window.setInterval(async () => {
          try {
            const progressResponse = await fetch("/api/progress");
            if (!progressResponse.ok) return;
            const progress = await progressResponse.json();
            showToast(progress.stage, progress.detail);
          } catch (_) {}
        }, 500);
        const timeout = setTimeout(() => {
          status.textContent = "The search is taking too long. Check the server logs and try again.";
        }, 120000);
        try {
          const onlyNew = form.elements.namedItem("only_new").checked;
          const refresh = form.elements.namedItem("refresh").checked;
          const response = await fetch(
            `/api/radar?t=${Date.now()}&only_new=${onlyNew}&refresh=${refresh}`,
            {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(profile)
            }
          );
          const body = await response.json();
          if (!response.ok) throw new Error(body.detail || "Radar request failed");
          renderResults(body);
        } catch (error) {
          status.textContent = error.message;
        } finally {
          clearTimeout(timeout);
          window.clearInterval(progressTimer);
          hideToast(3000);
          submitButton.disabled = false;
        }
      });

      function renderResults(body) {
        status.textContent = body.message || `${body.results.length} ranked results`;
        if (!body.results.length) {
          status.textContent = body.message || "No ranked results returned";
        }
        if (body.cached_count) {
          const age = body.newest_cached_age_hours == null
            ? ""
            : ` (cached ${Math.max(0, body.newest_cached_age_hours).toFixed(1)} hours ago)`;
          status.textContent += ` - ${body.cached_count} cached postings${age}`;
        }
        if (body.stats) {
          status.textContent += ` | Funnel: ${body.stats.searched} searched, ${body.stats.blocked_url} blocked URLs, ${body.stats.deduped} deduped, ${body.stats.extracted} extracted, ${body.stats.not_a_posting} not postings, ${body.stats.expired} expired, ${body.stats.stale} stale, ${body.stats.already_seen} already seen, ${body.stats.shown} shown`;
        }
        footer.textContent = `Provider: ${body.provider || "none / fallback unavailable"}`;

        for (const match of body.results) {
          const posting = match.posting;
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <h2>${escapeHtml(posting.title)}</h2>
            <p class="meta">${posting.is_new ? "New posting" : "Previously shown"}</p>
            ${posting.date_unverified ? '<p class="blockers">Date unverified - freshness cannot be confirmed</p>' : ""}
            <p><strong>${escapeHtml(posting.company)}</strong> - ${escapeHtml(posting.location || "Location not stated")}</p>
            <p class="score">Score: ${match.score}/100</p>
            <p>Deadline: ${escapeHtml(posting.deadline || "Not stated")}</p>
            ${match.reasons.length ? `<p>${match.reasons.map(escapeHtml).join("<br>")}</p>` : ""}
            ${match.blockers.length ? `<p class="blockers">${match.blockers.map(escapeHtml).join("<br>")}</p>` : ""}
            <p><a href="${escapeAttribute(posting.source_url)}" target="_blank" rel="noopener noreferrer">Source</a>
            ${posting.apply_url ? ` - <a href="${escapeAttribute(posting.apply_url)}" target="_blank" rel="noopener noreferrer">Application page</a>` : ""}</p>
            <button type="button" data-save>Save posting</button>
            <button type="button" data-draft>Draft opening</button>
            <div data-draft-output></div>
          `;
          card.querySelector("[data-save]").addEventListener("click", async () => {
            const button = card.querySelector("[data-save]");
            try {
              const saveResponse = await fetch("/api/postings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ profile: readProfile(), match })
              });
              if (!saveResponse.ok) {
                const error = await saveResponse.json();
                throw new Error(error.detail || "Could not save posting");
              }
              button.textContent = "Saved";
            } catch (error) {
              button.textContent = error.message;
            }
          });
          card.querySelector("[data-draft]").addEventListener("click", async () => {
            const output = card.querySelector("[data-draft-output]");
            output.textContent = "Drafting...";
            try {
              const draftResponse = await fetch("/api/draft", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  profile: readProfile(),
                  posting,
                  posting_id: `${posting.company}-${posting.title}`.replaceAll(" ", "-").toLowerCase()
                })
              });
              const draft = await draftResponse.json();
              if (!draftResponse.ok) throw new Error(draft.detail || "Draft request failed");
              output.replaceChildren();
              const copy = document.createElement("button");
              copy.type = "button";
              copy.textContent = "Copy draft";
              const paragraph = document.createElement("p");
              paragraph.textContent = draft.text;
              copy.addEventListener("click", async () => {
                await navigator.clipboard.writeText(draft.text);
                copy.textContent = "Copied";
              });
              output.append(paragraph, copy);
            } catch (error) {
              output.textContent = error.message;
            }
          });
          results.append(card);
        }
      }

      function escapeHtml(value) {
        const element = document.createElement("span");
        element.textContent = value == null ? "" : String(value);
        return element.innerHTML;
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replaceAll('"', "&quot;");
      }

      fetch("/api/stats")
        .then(response => response.json())
        .then(stats => {
          if (!stats.provider) {
            footer.textContent = `Provider usage: ${Object.keys(stats.counters).join(", ") || "none"}${stats.cache_only ? " (cache-only)" : ""}`;
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
