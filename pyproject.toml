[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-radar"
version = "0.1.0"
description = "Find, rank, and draft applications for software internships."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<1",
    "exa-py>=1.8,<2",
    "fastapi>=0.115,<1",
    "openai>=1.50,<2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.32,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

